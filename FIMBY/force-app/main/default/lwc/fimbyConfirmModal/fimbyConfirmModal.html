<template>
    <template lwc:if={isOpen}>
        <div class="modal-backdrop"
             role="dialog"
             aria-modal="true"
             aria-labelledby="confirm-modal-title"
             onclick={handleBackdrop}
             onkeydown={handleKeydown}>
            <div class="modal-container">
                <div class="modal-header">
                    <h2 id="confirm-modal-title" class="modal-title">{title}</h2>
                    <button type="button" class="close-btn" aria-label="Close" onclick={handleCancel}>
                        <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                    </button>
                </div>

                <div class="modal-body">
                    <template for:each={paragraphs} for:item="para">
                        <p key={para.key} class="modal-text">{para.text}</p>
                    </template>
                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="nav-btn nav-back"
                            onclick={handleCancel}
                            disabled={isProcessing}>
                        <span>{cancelLabel}</span>
                    </button>
                    <button type="button"
                            class={confirmButtonClass}
                            onclick={handleConfirm}
                            disabled={isProcessing}>
                        <template lwc:if={isProcessing}>
                            <span>{processingLabel}</span>
                        </template>
                        <template lwc:else>
                            <span>{confirmLabel}</span>
                        </template>
                    </button>
                </div>
            </div>
        </div>
    </template>
</template>
