<template>
    <div class="panel-body">
        <div class="member-card">
            <c-fimby-avatar class="member-photo" src={contactPhoto} name={panelData.contactName} contact-id={panelData.contactId} size="64"></c-fimby-avatar>
            <div class="member-info">
                <span class="member-name">{panelData.contactName}</span>
                <template lwc:if={panelData.pronouns}>
                    <span class="member-pronouns">{panelData.pronouns}</span>
                </template>
                <span class="member-meta">{waitingSummary}</span>
            </div>
        </div>

        <template lwc:if={isNoLongerPending}>
            <c-fimby-inline-banner variant="info" message={resolvedMessage}></c-fimby-inline-banner>
        </template>

        <p class="panel-hint">
            You can nudge the person they asked, check in with {firstName}, or vouch for them yourself.
        </p>

        <c-fimby-moderator-vouch-action
            contact-id={panelData.contactId}
            first-name={firstName}
            onvouched={handleVouched}>
        </c-fimby-moderator-vouch-action>
    </div>

    <div class="panel-footer">
        <div class="footer-primary-group">
            <button class="btn-action btn-primary" onclick={handleMessageNeighbour}>{messageNeighbourLabel}</button>
            <template lwc:if={hasReference}>
                <button class="btn-action btn-secondary" onclick={handleNudgeReference}>{nudgeLabel}</button>
            </template>
            <button class="btn-action btn-secondary" onclick={handleNoAction}>No Action Needed</button>
        </div>
        <button class="btn-action btn-link" onclick={handleViewProfile}>View Profile</button>
    </div>
</template>
