<template>
    <div class="fimby-tos-screen">
        <p class="fimby-tos-screen__link-row">
            <a href={tosUrl} target="_blank" rel="noopener noreferrer"
               class="fimby-tos-screen__link">
                Open the FIMBY Terms of Service (TOS)
                <span aria-hidden="true" class="fimby-tos-screen__link-icon">↗</span>
            </a>
        </p>

        <p class="fimby-tos-screen__consent" id="tos-consent-text">
            By tapping <strong>I agree</strong>, you confirm you've read the TOS and you're 19+.
        </p>

        <div class="fimby-tos-screen__actions">
            <button class="fimby-tos-screen__agree"
                    type="button"
                    disabled={agreeDisabled}
                    aria-describedby="tos-consent-text"
                    onclick={handleAgree}>
                <template lwc:if={submitting}>Recording…</template>
                <template lwc:elseif={acceptanceCompleted}>Recorded</template>
                <template lwc:else>I agree</template>
            </button>
            <button class="fimby-tos-screen__decline"
                    type="button"
                    onclick={handleDeclineLogout}>
                Not right now, log me out
            </button>
        </div>

        <template lwc:if={errorMessage}>
            <p class="fimby-tos-screen__error">{errorMessage}</p>
        </template>

        <div class="fimby-tos-screen__footer">
            <p class="fimby-tos-screen__footer-links">
                <a href={privacyUrl} target="_blank" rel="noopener noreferrer">Privacy Policy</a>
                <span aria-hidden="true" class="fimby-tos-screen__dot">·</span>
                <a href={guidelinesUrl} target="_blank" rel="noopener noreferrer">Community Guidelines</a>
            </p>
            <p class="fimby-tos-screen__help">
                Questions? <a href={helpEmailUrl}>{helpEmailLabel}</a>
            </p>
        </div>
    </div>
</template>
